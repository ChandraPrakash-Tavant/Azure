trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  tfVersion: 1.9.8

stages:
- stage: Plan
  displayName: Validate and Plan
  jobs:
  - job: Plan
    steps:
    - script: |
        curl -sSLo tf.zip https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip
        sudo unzip -o tf.zip -d /usr/local/bin
        terraform version
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Terraform init validate plan
      inputs:
        azureSubscription: azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -e
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_OIDC_TOKEN=$idToken
          export ARM_USE_OIDC=true
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform plan -input=false -out=tfplan

    - publish: $(System.DefaultWorkingDirectory)/tfplan
      artifact: tfplan

- stage: Apply
  displayName: Apply needs approval
  dependsOn: Plan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Apply
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: tfplan

          - script: |
              curl -sSLo tf.zip https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip
              sudo unzip -o tf.zip -d /usr/local/bin
            displayName: Install Terraform

          - task: AzureCLI@2
            displayName: Terraform apply
            inputs:
              azureSubscription: azure-sc
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_TENANT_ID=$tenantId
                export ARM_OIDC_TOKEN=$idToken
                export ARM_USE_OIDC=true
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init -input=false
                terraform apply -input=false -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
                terraform output
